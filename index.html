<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<meta name="description" content="Software engineer / lead" />
		<link rel="icon" href="/favicon-32x32.png" />

		<title>Tomáš Belada — Software Engineer / Lead</title>
		<style>
			html {
				background: #120e0d;
				color: #f4ece0;
				font: 15px/1.4 "Gill Sans", sans-serif;
				text-align: center;
			}

			body {
				margin: 0;
				padding: 24px;
				min-height: calc(100vh - 48px);
				display: grid;
				place-content: center;
			}

			body:before,
			body:after {
				content: "";
				position: fixed;
				z-index: -1;
				inset: 0;
			}

			body:before {
				inset: -10%;
				filter: blur(40px);
				background:
					radial-gradient(80% 40% at 50% 0, #2e5a94, #0000 70%),
					radial-gradient(60% 30% at 30% 45%, #7a86c0, #0000 70%),
					radial-gradient(60% 25% at 70% 55%, #e07a5a, #0000 70%),
					radial-gradient(90% 18% at 50% 64%, #ff6a22, #0000 70%),
					linear-gradient(#1a2a48, #3d67a0 35%, #b58aa0 55%, #f08a40 62%, #140f0e 70%);
			}

			body:after {
				opacity: 0.5;
				mix-blend-mode: overlay;
				background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
			}

			h1 {
				margin: 0;
				padding-left: 0.5em;
				font-size: 20.94px;
				font-weight: 400;
				letter-spacing: 0.5em;
				text-transform: uppercase;
			}

			p {
				margin: 10px 0 12vh;
				padding-left: 4px;
				font-size: 13px;
				letter-spacing: 4px;
				text-transform: uppercase;
			}

			ul {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px 28px;
				padding: 0;
				margin: 0;
				list-style: none;
			}

			a {
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid #f4ece066;
			}

			a:hover {
				color: #ffb070;
				border-color: #ffb070;
			}

			footer {
				position: fixed;
				bottom: 16px;
				left: 0;
				width: 100%;
				font-size: 11px;
				opacity: 0.5;
			}
		</style>
	</head>

	<body>
		<h1>Tomáš Belada</h1>
		<p>Software Engineer / Lead</p>

				<li>
					<a href="https://www.goodreads.com/user/show/67691498-tom-belada">Goodreads</a>
				</li>
				<li><a href="mailto:jades.hailing-0o@icloud.com">Email</a></li>
			</ul>
		</nav>
		<footer>This page fits into a single TCP packet.</footer>
	</body>
</html>
